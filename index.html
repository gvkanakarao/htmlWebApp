<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Price Fetcher Prototype</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; padding: 40px; }
        .container { background: #1e1e1e; padding: 20px; border-radius: 8px; max-width: 400px; }
        input, button { padding: 10px; margin-top: 10px; font-size: 1rem; }
        input { background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 4px; width: 70%; }
        button { background: #0d6efd; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0b5ed7; }
        #result { margin-top: 20px; font-size: 1.2rem; font-weight: bold; color: #4ade80; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Stock Price Checker</h2>
        <input type="text" id="tickerInput" placeholder="e.g. AAPL, TCS.NS">
        <button onclick="fetchPrice()">Get Price</button>
        <div id="result"></div>
    </div>

    <script>
        async function fetchPrice() {
            const ticker = document.getElementById('tickerInput').value.trim();
            const resultDiv = document.getElementById('result');
            resultDiv.innerText = "";

            if (!ticker) {
                alert("Please enter a ticker symbol!");
                return;
            }

            try {
                // Call your FastAPI backend endpoint
                const response = await fetch(`http://127.0.0.1:8000/get-price?ticker=${ticker}`);
                
                if (!response.ok) {
                    throw new Error("Failed to fetch");
                }

                const data = await response.json();
                resultDiv.innerText = `${data.ticker} Current Price: ₹${data.price}`;
            
            } catch (error) {
                alert("Failed to fetch price. Please check the ticker symbol and try again.");
            }
        }
    </script>

</body>
</html>
